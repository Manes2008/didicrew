brief_task:
  description: |
    Dựa trên ý tưởng ban đầu: "{idea}", và bối cảnh kênh: {channel_name} — {channel_description}.
    Mục tiêu kênh: {channel_goal}.

    Hãy xây dựng một bản CREATIVE BRIEF hoàn chỉnh, súc tích và chuyên nghiệp gồm đầy đủ các mục:

    1. **MỤC ĐÍCH NỘI DUNG**
       - Platform mục tiêu: TikTok / Reels / Shorts
       - Mục tiêu video: Giải trí / Cảm xúc / Lan truyền / Giáo dục
       - Thông điệp cốt lõi (Key Message) cần truyền tải

    2. **ĐỐI TƯỢNG XEM MỤC TIÊU**
       - Độ tuổi, giới tính, sở thích
       - Hành vi xem video (xem nhanh, xem đến cuối, chia sẻ...)

    3. **HỒ SƠ NHÂN VẬT CHÍNH (CHARACTER PROFILE)**
       - Tên nhân vật, giới tính, độ tuổi
       - Ngoại hình chi tiết: chiều cao, vóc dáng, màu tóc, kiểu tóc
       - Trang phục đặc trưng cho video này
       - Biểu cảm / tính cách chủ đạo

    4. **BỐI CẢNH & KHÔNG GIAN CHÍNH**
       - Địa điểm chính (1-2 địa điểm tối đa để giữ nhất quán)
       - Thời gian trong ngày, ánh sáng tổng thể
       - Không khí chủ đạo của không gian

    5. **TONE & MOOD**
       - Cảm xúc chủ đạo người xem cảm nhận được
       - Nhịp điệu: chậm rãi / năng động / kịch tính
       - Bảng màu chủ đạo

    6. **PHONG CÁCH NGHỆ THUẬT (ART STYLE — dùng cho sinh ảnh AI)**
       - Phong cách: anime / semi-realistic / cinematic live-action / illustration
       - Kỹ thuật camera: góc quay, lens style (35mm, wide, close-up)
       - Các từ khóa style tiếng Anh để dùng nhất quán trong mọi visual prompt
       - TUYỆT ĐỐI TRÁNH: "photorealistic", "8k", "hyper-detailed", "unreal engine"

    {markdown_template}
  expected_output: "Bản Creative Brief hoàn chỉnh định dạng Markdown với đầy đủ 6 mục: Mục đích, Đối tượng, Nhân vật, Bối cảnh, Tone/Mood, Art Style."

script_task:
  description: |
    Dựa trên CREATIVE BRIEF đã định hướng: "{previous_result}"
    Và ý tưởng gốc: "{idea}"

    Hãy viết kịch bản video ngắn hoàn chỉnh với CÁC YÊU CẦU BẮT BUỘC SAU:

    **[CẤU TRÚC THỜI LƯỢNG — BẮT BUỘC THỰC HIỆN]**
    - Tổng thời lượng mục tiêu: {target_duration} giây
    - Mỗi scene trung bình: ~8 giây (có thể dao động 5-12 giây tùy nội dung cảnh)
    - Tổng số scene cần có: tự tính theo công thức ({target_duration} ÷ 8), làm tròn — ĐÂY LÀ QUY TẮC LINH HOẠT, không cố định
    - Scene đầu (Hook): 3-5 giây
    - Đảm bảo tổng thời lượng cộng tất cả các scene phải ≈ {target_duration} giây

    **[PHẦN 1 — TÊN DỰ ÁN & HOOK]**
    - Tên video, định dạng, thời lượng dự kiến
    - CHIẾN LƯỢC HOOK 3 GIÂY ĐẦU: câu thoại mở đầu + mô tả hành động thu hút ngay lập tức

    **[PHẦN 2 — BẢNG PHÂN CẢNH CHI TIẾT]**
    Trình bày bảng Markdown với 5 cột:
    | Scene | Thời lượng | Visual Description (EN) | Voiceover (VI) | SFX/BGM |

    QUY TẮC CỘT VISUAL DESCRIPTION (tiếng Anh, dùng để sinh ảnh AI):
    - Scene 1: Bắt đầu bằng [ESTABLISHING] + mô tả toàn cảnh + nhân vật + ánh sáng + phong cách
    - Scene 2 trở đi: Bắt đầu bằng transition keyword: [CONTINUATION] / [CUT TO] / [PAN TO] / [CLOSE-UP ON] / [FADE TO]
    - Mỗi scene phải nhắc lại: tên nhân vật, trang phục đặc trưng từ Brief để đảm bảo character consistency
    - Mô tả đủ: bối cảnh, hành động nhân vật, biểu cảm, góc máy, ánh sáng
    - Cuối mỗi visual description: thêm `→ leads to Scene X` để chỉ dẫn chuyển cảnh

    **[PHẦN 3 — VEO3 SCRIPT (Mô tả tình huống chi tiết cho Veo3)]**
    Viết dưới dạng văn xuôi liên tục (KHÔNG phải bảng), mô tả toàn bộ video như một đạo diễn quan sát:
    - Viết thành đoạn văn liền mạch từ đầu đến cuối, KHÔNG chia thành các mục rời
    - Mô tả CỤ THỂ: hành động nhân vật từng giây, di chuyển, biểu cảm thay đổi theo thời gian
    - Mô tả chuyển cảnh liền mạch: camera di chuyển thế nào, ánh sáng thay đổi thế nào
    - Mô tả âm thanh nền, nhạc, không khí cảm xúc xuyên suốt
    - Kết thúc bằng cảnh CTA và cảm xúc người xem cảm nhận được
    - KHÔNG đề cập đến hình ảnh AI, không dùng từ "scene", "cảnh" — viết như mô tả thực tế

    **[PHẦN 4 — CTA]**
    - Lời kêu gọi hành động mạnh mẽ phù hợp platform

    {markdown_template}
  expected_output: "Kịch bản hoàn chỉnh với tổng thời lượng ≈ {target_duration}s gồm: Hook, bảng phân cảnh (số scene tự tính = {target_duration}÷8, mỗi scene ~8s linh hoạt, cột Visual EN với transition keywords + character consistency), Veo3 Script prose narrative liên tục, và CTA."

visual_task:
  description: |
    Dựa trên kịch bản chi tiết ở bước trước: "{previous_result}", hãy đóng vai trò là một Visual Prompt Engineer hàng đầu cho các mô hình khuếch tán hình ảnh (DALL-E 3, Midjourney, Stable Diffusion).
    Mô tả kênh hiện tại để bạn tham chiếu phong cách nghệ thuật: "{channel_description}".
    Nhiệm vụ của bạn là tạo ra bộ prompt mô tả hình ảnh cực kỳ chi tiết, đồng nhất và nghệ thuật:
    
    1. **HỒ SƠ NHÂN VẬT (CHARACTER PROFILE)**: Định nghĩa cụ thể về nhân vật chính (ngoại hình, tuổi, trang phục đặc trưng, kiểu tóc) để đảm bảo tính đồng nhất (Character Consistency).
    2. **PHONG CÁCH NGHỆ THUẬT (ART STYLE)**: Định nghĩa phong cách nghệ thuật đồng nhất cho toàn bộ video.
       - Hãy tự động phân tích mô tả kênh ở trên để chọn phong cách nghệ thuật phù hợp nhất (ví dụ: nghệ thuật tranh vẽ nếu kênh kể chuyện, phong cách nhiếp ảnh/điện ảnh đời thực nếu là kênh chia sẻ trải nghiệm/lịch sử).
       - NGUYÊN TẮC QUAN TRỌNG ĐỂ HÌNH ẢNH TỰ NHIÊN:
         * Tuyệt đối tránh các từ khóa AI sáo rỗng tạo cảm giác nhựa và giả tạo (như "photorealistic", "hyper-detailed", "8k", "unreal engine").
         * Nếu là phong cách đời thực, hãy sử dụng các thuật ngữ nhiếp ảnh thực tế (như "candid street photography", "shot on 35mm film", "natural soft lighting", "documentary style").
         * Tập trung mô tả chi tiết không hoàn hảo: các chuyển động ngẫu hứng, biểu cảm tự nhiên (nhân vật không nhìn trực diện ống kính), bối cảnh đời thường có chiều sâu thực tế.
    3. **DANH SÁCH PROMPT CHI TIẾT BẰNG TIẾNG ANH (VISUAL PROMPTS)**: Với mỗi Cảnh (Scene) từ kịch bản, hãy viết một prompt mô tả hình ảnh hoàn chỉnh bằng tiếng Anh theo cấu trúc: `[Phong cách nghệ thuật] + [Hồ sơ nhân vật] + [Mô tả chi tiết bối cảnh, hoạt động của nhân vật, góc máy cận cảnh/trung cảnh, ánh sáng, cảm xúc]`.
    
    Yêu cầu đầu ra phải được định dạng Markdown rõ ràng và nghiêm ngặt cho mỗi cảnh:
    `Scene [Số]: [Nội dung prompt tiếng Anh của cảnh đó]`
    {markdown_template}
  expected_output: "Hồ sơ nhân vật, phong cách nghệ thuật và danh sách Visual Prompt chi tiết bằng tiếng Anh định dạng Markdown rõ ràng cho mỗi phân cảnh."

image_task:
  description: |
    Dựa trên danh sách prompt hình ảnh từ bước trước: "{previous_result}", hãy lấy prompt của Scene 1 (hoặc tạo một prompt đại diện cho nhân vật chính) để sinh hình ảnh chính (Character Reference).
    Hãy gọi công cụ generate_gpt_image để tạo ảnh.
    Lưu ý: Prompt gửi đi phải được tối ưu hóa chất lượng, bổ sung phong cách nghệ thuật và chỉ thị phủ định để triệt tiêu chữ.
    {markdown_template}
  expected_output: "Đường dẫn ảnh cục bộ được tạo cho nhân vật chính từ Scene 1."

voice_task:
  description: |
    Dựa trên kịch bản gốc ở bước 1: "{script}".
    Hãy lọc và kết hợp toàn bộ phần Lời thoại/Thuyết minh (Voiceover) của các phân cảnh thành một đoạn văn thuyết minh tiếng Việt liền mạch để đọc voiceover.
    
    Yêu cầu kết quả đầu ra:
    1. **VĂN BẢN ĐỌC LIỀN MẠCH**: Chỉ chứa văn bản cần đọc trực tiếp (không bao gồm tên phân cảnh, mô tả hình ảnh, hay ký hiệu đặc biệt).
    2. **ĐỀ XUẤT GIỌNG ĐỌC**: Gợi ý các tham số cấu hình ElevenLabs (ví dụ: Tên giọng đọc, độ ổn định Stability, độ rõ Clarity) phù hợp nhất với tone & mood của kịch bản.
    {markdown_template}
  expected_output: "Văn bản voiceover hoàn chỉnh liền mạch bằng tiếng Việt + cấu hình giọng đọc ElevenLabs đề xuất."

editor_task:
  description: |
    Dựa trên kịch bản gốc: "{script}" và các hình ảnh đã tạo ở các bước trước.
    Hãy đóng vai trò là một Chuyên gia Dựng phim chuyên nghiệp để viết cẩm nang hướng dẫn dựng video hoàn chỉnh trên CapCut:
    
    1. **CHUẨN BỊ TÀI NGUYÊN**: Hướng dẫn sắp xếp hình ảnh và file âm thanh (voiceover).
    2. **ĐỒNG BỘ ÂM THANH & HÌNH ẢNH**: Hướng dẫn chi tiết cách khớp hình ảnh của từng phân cảnh theo nhịp của giọng đọc voiceover.
    3. **HIỆU ỨNG & CHUYỂN CẢNH (EFFECTS & TRANSITIONS)**: Gợi ý các hiệu ứng chuyển cảnh mượt mà, hiệu ứng chữ (text animation) cho phụ đề tự động (auto captions) giúp tăng trải nghiệm người xem.
    4. **MÀU SẮC & ÂM THANH PHỤ**: Gợi ý filter màu và âm lượng nhạc nền (BGM) thích hợp để làm nổi bật giọng đọc chính.
    {markdown_template}
  expected_output: "Hướng dẫn dựng video chi tiết từng bước bằng Markdown trên CapCut."
