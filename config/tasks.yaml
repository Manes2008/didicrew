brief_task:
  description: |
    Dựa trên ý tưởng ban đầu: "{idea}", và bối cảnh kênh: {channel_name} — {channel_description}.
    Mục tiêu kênh: {channel_goal}.

    Hãy xây dựng một bản CREATIVE BRIEF hoàn chỉnh, súc tích và chuyên nghiệp gồm đầy đủ các mục:

    1. **MỤC ĐÍCH NỘI DUNG**
       - Platform mục tiêu: TikTok / Reels / Shorts
       - Mục tiêu video: Giải trí / Cảm xúc / Lan truyền / Giáo dục
       - Thông điệp cốt lõi (Key Message) cần truyền tải

    2. **ĐỐI TƯỢNG XEM MỤC TIÊU**
       - Độ tuổi, giới tính, sở thích
       - Hành vi xem video (xem nhanh, xem đến cuối, chia sẻ...)

    3. **HỒ SƠ NHÂN VẬT CHÍNH (CHARACTER PROFILE)**
       - Tên nhân vật, giới tính, độ tuổi
       - Ngoại hình chi tiết: chiều cao, vóc dáng, màu tóc, kiểu tóc
       - Trang phục đặc trưng cho video này
       - Biểu cảm / tính cách chủ đạo

    4. **BỐI CẢNH & KHÔNG GIAN CHÍNH**
       - Địa điểm chính (1-2 địa điểm tối đa để giữ nhất quán)
       - Thời gian trong ngày, ánh sáng tổng thể
       - Không khí chủ đạo của không gian

    5. **TONE & MOOD**
       - Cảm xúc chủ đạo người xem cảm nhận được
       - Nhịp điệu: chậm rãi / năng động / kịch tính
       - Bảng màu chủ đạo

    6. **PHONG CÁCH NGHỆ THUẬT (ART STYLE — dùng cho sinh ảnh AI)**
       - Phong cách: anime / semi-realistic / cinematic live-action / illustration
       - Kỹ thuật camera: góc quay, lens style (35mm, wide, close-up)
       - Các từ khóa style tiếng Anh để dùng nhất quán trong mọi visual prompt
       - TUYỆT ĐỐI TRÁNH: "photorealistic", "8k", "hyper-detailed", "unreal engine"

    {markdown_template}
  expected_output: "Bản Creative Brief hoàn chỉnh định dạng Markdown với đầy đủ 6 mục: Mục đích, Đối tượng, Nhân vật, Bối cảnh, Tone/Mood, Art Style."

script_task:
  description: |
    Dựa trên CREATIVE BRIEF đã định hướng: "{previous_result}"
    Và ý tưởng gốc: "{idea}"

    Hãy viết kịch bản video ngắn hoàn chỉnh với CÁC YÊU CẦU BẮT BUỘC SAU:

    **[CẤU TRÚC THỜI LƯỢNG - BẮT BUỘC THỰC HIỆN]**
    - Tổng thời lượng mục tiêu: {target_duration} giây
    - Mỗi scene trung bình: 2 giây đến 4 giây (dao động từ 2-4s cho mỗi phân cảnh)
    - Tổng số scene cần có: tự tính theo công thức ({target_duration} / 3.0), làm tròn - đây là yêu cầu bắt buộc để tăng số lượng cảnh lên, tạo nhịp độ nhanh và lôi cuốn
    - Scene đầu (Hook): 2-3 giây
    - Đảm bảo tổng thời lượng cộng tất cả các scene phải xấp xỉ {target_duration} giây
    - [MẬT ĐỘ TỪ VÀ THỜI LƯỢNG ĐỌC]: Tốc độ đọc tiếng Việt tự nhiên là khoảng 2.5 từ/giây. Video {target_duration} giây cần tổng lượng voiceover xấp xỉ ({target_duration} * 2.5) từ (ví dụ: video 30s cần khoảng 75 từ, video 60s cần khoảng 150 từ). Bạn phải phân bổ đều số từ này trên tất cả các cảnh (mỗi cảnh 2-4s tương ứng 5-10 từ) để đảm bảo kịch bản đủ dài và không bị quá ngắn.

    **[LỜI MỞ ĐẦU VÀ KẾT THÚC - BẮT BUỘC]**
    - Scene đầu tiên (Scene 1): Bắt đầu bằng lời mở đầu giới thiệu ngắn gọn, tạo hook cuốn hút ngay lập tức để giới thiệu chủ đề video (Nội dung chính là HOOK ở Phần 1).
    - Scene cuối cùng (Scene cuối): Phải chứa lời kết thúc cô đọng, đúc kết thông điệp cốt lõi của video, kết hợp với lời kêu gọi hành động (Nội dung chính là CTA ở Phần 4).

    **[PHÂN ĐỊNH LỜI DẪN CHUYỆN VÀ THOẠI NHÂN VẬT - QUAN TRỌNG]**
    - Phải có dẫn chuyện (Voiceover / Narrator) chính xác kết nối cốt truyện, liên kết mạch câu chuyện xuyên suốt từ cảnh đầu đến cảnh cuối.
    - Dẫn chuyện phải đóng vai trò dẫn dắt mạch truyện và kéo các cảnh lại với nhau.
    - Lời thoại nhân vật (Character Dialogue): Chỉ dành riêng cho nhân vật khi họ phát biểu. Đặt lời thoại nhân vật trong dấu ngoặc kép (Ví dụ: Nhân vật A nói: "...").
    - Đảm bảo nhân vật chỉ thoại phần thoại riêng của họ, tuyệt đối KHÔNG cho nhân vật tự nói luôn lời cốt chuyện hay tự đọc lời dẫn chuyện.

    **[CHỐNG TRÙNG LẶP HÌNH ẢNH NHÂN VẬT THOẠI]**
    - Visual Description cho mỗi cảnh phải mô tả hình ảnh nhân vật với biểu cảm, hành động hoặc bối cảnh biến đổi khác biệt để đảm bảo khi AI sinh ảnh không bị trùng lặp tư thế hay hình ảnh nhân vật.
    - Đảm bảo các cảnh có sự tiếp nối mượt mà nhưng khác biệt rõ ràng về hành vi và góc máy.

    **[PHẦN 1 - TÊN DỰ ÁN & HOOK]**
    - Tên video, định dạng, thời lượng dự kiến
    - CHIẾN LƯỢC HOOK 3 GIÂY ĐẦU: câu thoại mở đầu + mô tả hành động thu hút ngay lập tức (Nội dung này phải đồng bộ và được sử dụng làm Voiceover cho Scene 1)

    **[PHẦN 2 - BẢNG PHÂN CẢNH CHI TIẾT]**
    Trình bày bảng Markdown với 5 cột:
    | Scene | Thời lượng | Visual Description (EN) | Voiceover (VI) | SFX/BGM |

    QUY TẮC CỘT VISUAL DESCRIPTION (tiếng Anh, dùng để sinh ảnh AI):
    - TĂNG ĐỘ CHI TIẾT TỐI ĐA: Mỗi mô tả tiếng Anh phải dài ít nhất 3-4 câu chi tiết.
    - Phải mô tả cụ thể về: di chuyển camera (Ví dụ: slow zoom in, cinematic tracking, gentle pan left/right), điều kiện ánh sáng & màu sắc (Ví dụ: golden hour backlight, volumetric sunbeams), biểu cảm nhỏ của nhân vật (Ví dụ: eyes widening in surprise, a subtle nostalgic smile), và chi tiết bối cảnh/hậu cảnh.
    - CẤM MÔ TẢ TĨNH (CHỐNG BỊ ĐƠ HÌNH): Tuyệt đối không viết mô tả tĩnh như nhân vật chỉ đứng nhìn, đứng im. Mỗi cảnh phải chứa hành động động (Action/Movement) cụ thể (Ví dụ: running through mud, hands trembling while holding a photo, looking up suddenly as explosions light up the sky).
    - TĂNG TÍNH LIÊN KẾT: Cảnh sau phải liên kết mượt mà và đồng bộ góc máy với cảnh trước (Ví dụ: "matching the camera angle of the previous shot...", "continuing the tracking motion from Scene X...").
    - Scene 1: Bắt đầu bằng [ESTABLISHING] + mô tả toàn cảnh + nhân vật + ánh sáng + phong cách
    - Scene 2 trở đi: Bắt đầu bằng transition keyword: [CONTINUATION] / [CUT TO] / [PAN TO] / [CLOSE-UP ON] / [FADE TO]
    - Mỗi scene phải nhắc lại: tên nhân vật, trang phục đặc trưng từ Brief để đảm bảo character consistency
    - Cuối mỗi visual description: thêm "leads to Scene X" để chỉ dẫn chuyển cảnh

    **[PHẦN 3 - VEO3 SCRIPT (Gộp phân cảnh theo nhịp 8 giây của Veo3 - QUAN TRỌNG)]**
    Vì mỗi video do công cụ Veo3 sinh ra có thời lượng mặc định là 8 giây, bạn bắt buộc phải GỘP các cảnh ngắn (2-4s) liền kề từ Phần 2 lại với nhau thành các Phân cảnh Veo3 lớn dài xấp xỉ 8 giây (Ví dụ: Cảnh 1 (3s) + Cảnh 2 (5s) -> Gộp thành Phân cảnh Veo3 1 (8s); video 60s sẽ được gộp lại thành khoảng 7-8 phân cảnh Veo3 lớn). Định dạng đầu ra nghiêm ngặt cho mỗi phân cảnh lớn sau khi gộp như sau:
    - **Phân cảnh Veo3 X (Gộp từ Cảnh A, B...)**:
      * **Combined Visual (EN)**: [Đoạn văn tiếng Anh liền mạch, nghệ thuật và giàu tính liên kết dài ít nhất 4-5 câu, kết hợp tự nhiên mô tả hình ảnh và chuyển động của các cảnh thành phần A, B... từ bảng phân cảnh Phần 2. Prompt này phải chứa từ khóa chuyển cảnh ở đầu (Ví dụ: [ESTABLISHING], [CONTINUATION]...), giữ nguyên hồ sơ nhân vật/phong cách nhất quán và kết thúc bằng hướng chuyển tiếp trơn tru sang cảnh tiếp theo. Tuyệt đối KHÔNG viết các trường rời rạc mà phải tạo thành một mô tả hành động điện ảnh hoàn chỉnh. Đối với Phân cảnh 1, prompt phải thể hiện rõ nét yếu tố thiết lập bối cảnh lôi cuốn thị giác (Hook). Đối với Phân cảnh cuối, prompt phải kết thúc bằng hành động kết bài hoặc kêu gọi trực quan đồng bộ với CTA ở Phần 4.]
      * **Voiceover / Dialogue (VI)**: [Toàn bộ phần thuyết minh và thoại nhân vật của các cảnh thành phần A, B... viết liền nhau. Phải ghi rõ thẻ vai nghiêm ngặt: [NARRATOR]: Lời thuyết minh/lời dẫn; hoặc [DIALOGUE - Tên nhân vật]: "Lời thoại nhân vật trong ngoặc kép". Tuyệt đối không để nhân vật tự nói lời dẫn chuyện hay tự đọc lời cốt truyện.]
      * **SFX/BGM**: [Nhạc nền và hiệu ứng âm thanh tương ứng từ Phần 2]
      * **Veo3 Detail**: [Mô tả chi tiết tiến trình hành động, biểu cảm, di chuyển camera của nhân vật từ giây 0 đến giây 8 bằng tiếng Việt để hỗ trợ sinh chuyển động.]

    **[PHẦN 4 - CTA]**
    - Lời kêu gọi hành động mạnh mẽ phù hợp platform (Nội dung này phải đồng bộ và được sử dụng làm Voiceover cho Scene cuối)

    {markdown_template}
  expected_output: "Kịch bản hoàn chỉnh với tổng thời lượng xấp xỉ {target_duration}s gồm: Hook (lời mở đầu), bảng phân cảnh (số scene tự tính = {target_duration}/3.0, mỗi scene 2-4s linh hoạt, cột Visual EN với transition keywords + character consistency, cột Voiceover phân định rõ dẫn chuyện và thoại), Veo3 Script phân tách rõ ràng theo từng phân cảnh gộp (Combined Visual EN) liền mạch dài 8s và phân vai thoại rõ ràng, lời kết thúc và CTA."

visual_task:
  description: |
    Dựa trên kịch bản chi tiết ở bước trước: "{previous_result}", hãy đóng vai trò là một Visual Prompt Engineer hàng đầu cho các mô hình khuếch tán hình ảnh (DALL-E 3, Midjourney, Stable Diffusion).
    Mô tả kênh hiện tại để bạn tham chiếu phong cách nghệ thuật: "{channel_description}".
    Nhiệm vụ của bạn là tạo ra bộ prompt mô tả hình ảnh cực kỳ chi tiết, đồng nhất và nghệ thuật:
    
    1. **HỒ SƠ NHÂN VẬT (CHARACTER PROFILE)**: Định nghĩa cụ thể về nhân vật chính (ngoại hình, tuổi, trang phục đặc trưng, kiểu tóc) để đảm bảo tính đồng nhất (Character Consistency).
    2. **PHONG CÁCH NGHỆ THUẬT (ART STYLE)**: Định nghĩa phong cách nghệ thuật đồng nhất cho toàn bộ video.
       - Hãy tự động phân tích mô tả kênh ở trên để chọn phong cách nghệ thuật phù hợp nhất (ví dụ: nghệ thuật tranh vẽ nếu kênh kể chuyện, phong cách nhiếp ảnh/điện ảnh đời thực nếu là kênh chia sẻ trải nghiệm/lịch sử).
       - NGUYÊN TẮC QUAN TRỌNG ĐỂ HÌNH ẢNH TỰ NHIÊN:
         * Tuyệt đối tránh các từ khóa AI sáo rỗng tạo cảm giác nhựa và giả tạo (như "photorealistic", "hyper-detailed", "8k", "unreal engine").
         * Nếu là phong cách đời thực, hãy sử dụng các thuật ngữ nhiếp ảnh thực tế (như "candid street photography", "shot on 35mm film", "natural soft lighting", "documentary style").
         * Tập trung mô tả chi tiết không hoàn hảo: các chuyển động ngẫu hứng, biểu cảm tự nhiên (nhân vật không nhìn trực diện ống kính), bối cảnh đời thường có chiều sâu thực tế.
    3. **DANH SÁCH PROMPT CHI TIẾT BẰNG TIẾNG ANH (VISUAL PROMPTS)**: Với mỗi Cảnh (Scene) từ kịch bản, hãy viết một prompt mô tả hình ảnh hoàn chỉnh bằng tiếng Anh theo cấu trúc: `[Phong cách nghệ thuật] + [Hồ sơ nhân vật] + [Mô tả chi tiết bối cảnh, hoạt động của nhân vật, góc máy cận cảnh/trung cảnh, ánh sáng, cảm xúc]`.
    
    Yêu cầu đầu ra phải được định dạng Markdown rõ ràng và nghiêm ngặt cho mỗi cảnh:
    `Scene [Số]: [Nội dung prompt tiếng Anh của cảnh đó]`
    {markdown_template}
  expected_output: "Hồ sơ nhân vật, phong cách nghệ thuật và danh sách Visual Prompt chi tiết bằng tiếng Anh định dạng Markdown rõ ràng cho mỗi phân cảnh."

image_task:
  description: |
    Dựa trên danh sách prompt hình ảnh từ bước trước: "{previous_result}", hãy lấy prompt của Scene 1 (hoặc tạo một prompt đại diện cho nhân vật chính) để sinh hình ảnh chính (Character Reference).
    Hãy gọi công cụ generate_gpt_image để tạo ảnh.
    Lưu ý: Prompt gửi đi phải được tối ưu hóa chất lượng, bổ sung phong cách nghệ thuật và chỉ thị phủ định để triệt tiêu chữ.
    {markdown_template}
  expected_output: "Đường dẫn ảnh cục bộ được tạo cho nhân vật chính từ Scene 1."

voice_task:
  description: |
    Dựa trên kịch bản gốc ở bước 1: "{script}".
    Hãy lọc, phân loại và kết hợp toàn bộ phần Lời thoại/Thuyết minh (Voiceover) của các phân cảnh để chuẩn bị cho việc lồng tiếng.
    
    Yêu cầu kết quả đầu ra:
    1. **PHÂN CHIA VĂN BẢN ĐỌC CHI TIẾT**: Tách biệt rõ ràng phần văn bản đọc theo vai:
       - [NARRATOR]: Lời dẫn chuyện đóng vai trò dẫn dắt và kết nối câu chuyện.
       - [DIALOGUE - Tên nhân vật]: Lời thoại riêng của nhân vật (để trong ngoặc kép).
    2. **ĐỀ XUẤT GIỌNG ĐỌC RIÊNG BIỆT**: Gợi ý chi tiết cấu hình ElevenLabs khác nhau cho từng vai (giọng đọc riêng cho Người dẫn chuyện và giọng đọc riêng cho từng nhân vật phát biểu) để đảm bảo không bị trùng giọng đọc.
    {markdown_template}
  expected_output: "Văn bản lồng tiếng hoàn chỉnh phân chia rõ ràng theo vai (Narrator và Nhân vật) + đề xuất cấu hình giọng đọc ElevenLabs riêng biệt cho từng vai."

editor_task:
  description: |
    Dựa trên kịch bản gốc: "{script}" và các hình ảnh đã tạo ở các bước trước.
    Hãy đóng vai trò là một Chuyên gia Dựng phim chuyên nghiệp để viết cẩm nang hướng dẫn dựng video hoàn chỉnh trên CapCut:
    
    1. **CHUẨN BỊ TÀI NGUYÊN**: Hướng dẫn sắp xếp hình ảnh và file âm thanh (voiceover).
    2. **ĐỒNG BỘ ÂM THANH & HÌNH ẢNH**: Hướng dẫn chi tiết cách khớp hình ảnh của từng phân cảnh theo nhịp của giọng đọc voiceover.
    3. **HIỆU ỨNG & CHUYỂN CẢNH (EFFECTS & TRANSITIONS)**: Gợi ý các hiệu ứng chuyển cảnh mượt mà, hiệu ứng chữ (text animation) cho phụ đề tự động (auto captions) giúp tăng trải nghiệm người xem.
    4. **MÀU SẮC & ÂM THANH PHỤ**: Gợi ý filter màu và âm lượng nhạc nền (BGM) thích hợp để làm nổi bật giọng đọc chính.
    {markdown_template}
  expected_output: "Hướng dẫn dựng video chi tiết từng bước bằng Markdown trên CapCut."
