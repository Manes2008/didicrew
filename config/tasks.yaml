brief_task:
  description: |
    Dựa trên ý tưởng ban đầu: "{idea}", và bối cảnh kênh: {channel_name} — {channel_description}.
    Mục tiêu kênh: {channel_goal}.

    Hãy xây dựng một bản CREATIVE BRIEF hoàn chỉnh, súc tích và chuyên nghiệp gồm đầy đủ các mục:

    1. **MỤC ĐÍCH NỘI DUNG**
       - Platform mục tiêu: TikTok / Reels / Shorts
       - Mục tiêu video: Giải trí / Cảm xúc / Lan truyền / Giáo dục
       - Thông điệp cốt lõi (Key Message) cần truyền tải

    2. **ĐỐI TƯỢNG XEM MỤC TIÊU**
       - Độ tuổi, giới tính, sở thích
       - Hành vi xem video (xem nhanh, xem đến cuối, chia sẻ...)

    3. **HỒ SƠ NHÂN VẬT CHỦ ĐẠO (MASTER CHARACTER PROFILE)**
       - Tên nhân vật, giới tính, độ tuổi
       - Ngoại hình chi tiết nhất quán: chiều cao, vóc dáng, màu tóc, kiểu tóc, màu da, đôi mắt
       - Trang phục đặc trưng cố định (Signature Outfit) xuyên suốt video
       - Biểu cảm / tính cách chủ đạo

    4. **BỐI CẢNH & KHÔNG GIAN CHÍNH (MASTER ENVIRONMENT)**
       - Địa điểm chính (1-2 địa điểm tối đa để giữ nhất quán tuyệt đối)
       - Thời gian trong ngày, phong cách ánh sáng tổng thể (lighting style)
       - Không khí và gam màu chủ đạo của không gian

    5. **TONE & MOOD**
       - Cảm xúc chủ đạo người xem cảm nhận được
       - Nhịp điệu: chậm rãi / năng động / kịch tính
       - Bảng màu chủ đạo (Color Palette)

    6. **PHONG CÁCH NGHỆ THUẬT & TOKENS CHUẨN (MASTER ART STYLE TOKENS)**
       - Phong cách: cinematic live-action / anime / semi-realistic / 3d animation
       - Kỹ thuật camera: góc quay điện ảnh, lens style (35mm, 50mm, anamorphic, Arri Alexa look)
       - Master Style Keywords (tiếng Anh) dùng cố định làm "mỏ neo" cho tất cả visual prompts
       - TUYỆT ĐỐI TRÁNH: "photorealistic", "8k", "hyper-detailed", "unreal engine"

    {markdown_template}
  expected_output: "Bản Creative Brief hoàn chỉnh định dạng Markdown với đầy đủ 6 mục: Mục đích, Đối tượng, Hồ sơ nhân vật chủ đạo, Bối cảnh chính, Tone/Mood, Master Art Style Tokens."

script_task:
  description: |
    Dựa trên CREATIVE BRIEF đã định hướng: "{previous_result}"
    Và ý tưởng gốc: "{idea}"

    Hãy viết kịch bản video ngắn hoàn chỉnh tối ưu cho công cụ sinh video AI thế hệ mới (Google Veo 3 / Runway Gen-3 / Kling).
    Tổng thời lượng mục tiêu: {target_duration} giây.

    **[CẤU TRÚC PHÂN BỔ THỜI LƯỢNG & ĐỘ DÀY LỜI THOẠI]**
    - Tổng thời lượng: {target_duration} giây.
    - Chia video thành các cảnh linh hoạt từ 3-5 giây để giữ trọn nhịp điệu cảm xúc và hình ảnh chuyển động điện ảnh.
    - ĐỘ DÀY LỜI THOẠI (BẮT BUỘC): Mỗi cảnh phải có từ 14 đến 22 từ, tuyệt đối cấm câu cụt ngủn dưới 10 từ. Lời thoại phải đạt chuẩn văn học điện ảnh, sử dụng câu phức, hình ảnh ẩn dụ giàu sức nặng tâm lý (Subtext & Psychological Weight).
    - Tốc độ đọc tiếng Việt chuẩn: 3.5 - 4 từ/giây. Tổng số từ toàn kịch bản xấp xỉ ({target_duration} * 4) từ.

    **[PHÂN ĐỊNH LỜI DẪN CHUYỆN VÀ THOẠI NHÂN VẬT ĐA TẦNG]**
    - [NARRATOR]: Lời dẫn chuyện đẫm tính văn học, mở ra không gian bối cảnh và dẫn dắt mạch cảm xúc sâu lắng.
    - [DIALOGUE - Tên]: Lời thoại trực tiếp của nhân vật, bật ra từ nội tâm giằng xé, nỗi đau hoặc niềm tự hào kiêu hãnh, đặt trong dấu ngoặc kép.
    - Trong các phân cảnh cao trào, có thể đan xen cả [NARRATOR] gợi mở và [DIALOGUE] tiếp nối liền mạch để tạo độ dày cảm xúc.

    **[PHẦN 1 - TÊN DỰ ÁN & CHIẾN LƯỢC HOOK 3 GIÂY ĐẦU]**
    - Tên video, định dạng (9:16), thời lượng ({target_duration}s).
    - CHIẾN LƯỢC HOOK 3S ĐẦU (BẮT BUỘC CHỌN 1 TRONG 2 MÔ THỨC):
      * Mô thức A (Số liệu tương phản): Cấu trúc [Tuổi tác/Thời gian] - [Chiến tích/Nghịch cảnh khốc liệt] (Ví dụ: "24 tuổi - đã sống sót qua 27 trận bom đạn ác liệt nhất").
      * Mô thức B (Nghịch lý cảm xúc cực độ): Lời khẳng định đanh thép, gây chấn động tâm lý ngay lập tức (Ví dụ: "Có những người lính ra đi mà thân thể vĩnh viễn không bao giờ lành lặn").
      * TUYỆT ĐỐI CẤM: Mở đầu bằng lối kể chuyện chậm rãi, mô tả hoàn cảnh chung chung.

    **[PHẦN 2 - BẢNG PHÂN CẢNH CHI TIẾT (CHUẨN 6 CỘT)]**
    Trình bày bảng Markdown chuẩn 6 cột (bắt buộc để hệ thống đo đạc thời lượng và render trực quan):
    | Scene | Thời lượng | Visual Description (EN) | Voiceover / Dialogue (VI) | On-Screen Flash Text (VI) | SFX/BGM |
    |---|---|---|---|---|---|
    | Cảnh 1 | 3s | [Prompt mô tả hành động, camera, ánh sáng] | [NARRATOR]: Lời thoại dày dặn 14-22 từ... | [TỪ KHÓA ĐẬP MẮT 2-5 TỪ] | Âm thanh mở màn kịch tính |
    | Cảnh 2 | 4s | ... | ... | ... | ... |

    **[PHẦN 3 - TRÍCH XUẤT PROMPT VEO3 CHI TIẾT TỪNG CẢNH (QUAN TRỌNG)]**
    Với mỗi cảnh, trích xuất đoạn Prompt tiếng Anh chuẩn cho Veo 3 (Text-to-Video hoặc Image-to-Video với Reference Frame) theo định dạng:

    - **Phân cảnh Veo3 1 (0s - 3s)**:
      * **Combined Visual (EN)**: [Prompt tiếng Anh hoàn chỉnh 4-6 câu kết hợp: Master Art Style + Character Profile + Dynamic Camera Movement (ví dụ: cinematic slow dolly in, steadycam tracking, eye-level shot) + Action & Micro-expressions + Lighting Transition + Environment details].
      * **Voiceover / Dialogue (VI)**: [Đoạn thoại dày dặn của cảnh này, 14-22 từ].
      * **On-Screen Flash Text (VI)**: [Từ khóa in hoa giật màn hình 0.5s - 1s, ví dụ: 27 TRẬN TỬ CHIẾN].
      * **SFX/BGM**: [Hiệu ứng âm thanh và sắc thái nhạc nền].

    - **Phân cảnh Veo3 2 (3s - 7s)**:
      * **Combined Visual (EN)**: [Prompt tiếng Anh chi tiết cho cảnh 2, nối tiếp chuyển động từ cảnh 1].
      * **Voiceover / Dialogue (VI)**: [...]
      * **On-Screen Flash Text (VI)**: [...]
      * **SFX/BGM**: [...]

    (Lặp lại đầy đủ cho tất cả các cảnh đến hết thời lượng {target_duration}s. Cảnh chứa CÂU THOẠI VÀNG - GOLDEN QUOTE phải được đánh dấu rõ bằng chỉ dẫn [CÂU THOẠI VÀNG]).

    **[PHẦN 4 - LỜI KÊU GỌI HÀNH ĐỘNG TƯƠNG TÁC (INTERACTIVE EMOTIONAL CTA)]**
    - Lời kêu gọi hành động ở cảnh cuối cùng chạm vào lòng tự hào hoặc tình cảm cá nhân của khán giả, kích hoạt bình luận.
    - BẮT BUỘC: Đặt câu hỏi kết nối trực tiếp hoặc kêu gọi comment từ khóa tri ân (Ví dụ: "Nếu trong gia đình bạn có một người lính cựu chiến binh, hãy để lại lời cảm ơn dưới phần bình luận").
    - TUYỆT ĐỐI CẤM: Các câu sáo rỗng như "Hãy like, share, bấm tim và đăng ký kênh".

    **[PHẦN 5 - ĐÓNG GÓI CAPTION & BỘ HASHTAG VIRAL (SOCIAL PACKAGING)]**
    Tạo sẵn nội dung để đăng tải trực tiếp lên TikTok / Reels / Shorts:
    - **Caption mẫu**: Gồm 3 phần: (1) Câu mở đầu gây sốc/tò mò, (2) Đúc kết cảm xúc 2 dòng, (3) Lời kêu gọi thảo luận kèm icon tối giản.
    - **Bảng Hashtag chiến lược**:
      | Nhóm | Danh sách Hashtags | Mục đích tiếp cận |
      |---|---|---|
      | Core / Brand | #TenKenh #TenChuDeChinh | Nhận diện thương hiệu kênh |
      | Trending | #TriAn #LichSuVietNam ... | Đẩy xu hướng thịnh hành |
      | Seasonal / Timely | #NgayLe #Tet2026 ... | Bắt nhịp thời điểm vàng |
      | Broad Reach | #Storytelling #ViralVideo ... | Tiếp cận khán giả đại chúng |

    {markdown_template}
  expected_output: "Kịch bản hoàn chỉnh dạng Markdown gồm: Hook 3s số liệu, Bảng phân cảnh 6 cột có On-Screen Text, Danh sách Prompt Veo3 từng cảnh, Interactive CTA và Bộ đóng gói Caption/Hashtag."

visual_task:
  description: |
    Dựa trên CREATIVE BRIEF và KỊCH BẢN: "{previous_result}".
    Bạn là Visual Prompt Engineer chuyên gia về độ nhất quán nhân vật (Character Consistency).

    **CHIẾN LƯỢC TỐI ƯU CHI PHÍ & NHẤT QUÁN DỮ LIỆU**:
    Thay vì tạo hàng chục ảnh lẻ gây biến dạng mặt và tốn kém chi phí, bạn sẽ tạo:
    1. **1 Master Character Reference Sheet Prompt**: Mô tả nhân vật ở dạng Multi-Angle (chân dung cận cảnh, toàn thân, góc nghiêng 45 độ) hoặc 1 chân dung điện ảnh chuẩn với trang phục cố định để làm mỏ neo hình ảnh (Reference Anchor) cho Veo 3.
    2. **1 Master Environment/Keyframe Prompt**: Khung cảnh bối cảnh chính với ánh sáng và bảng màu chuẩn.
    3. **Tóm tắt danh sách Prompt Veo 3**: Bộ từ khóa mô tả chuyển động và camera cho từng phân cảnh.

    **Định dạng đầu ra BẮT BUỘC (Markdown)**:
    ### 1. MASTER CHARACTER REFERENCE SHEET PROMPT (Dùng tạo ảnh mỏ neo)
    - **Prompt (EN)**: `[Master Art Style] + Character Sheet multi-angle portrait, full body and 45-degree angle, consistent facial features, signature outfit [chi tiết quần áo], neutral studio/cinematic lighting, clean composition, high coherence, shot on 50mm lens, film aesthetic --ar 16:9`

    ### 2. MASTER ENVIRONMENT PROMPT (Dùng tạo ảnh bối cảnh nền)
    - **Prompt (EN)**: `[Master Art Style] + Cinematic environment establishing shot of [Bối cảnh chính], atmospheric lighting, volumetric smoke/dust, deep depth of field --ar 16:9`

    ### 3. VEO3 DYNAMIC SCENE PROMPTS TABLE
    | Scene | Thời lượng | Veo3 Dynamic Prompt (EN) | Ghi chú Camera & Lighting |
    |---|---|---|---|
    | Scene 1 | 3s | [Prompt kết hợp Master Character + Action + Camera Movement] | Dolly in, Warm golden hour |
    | Scene 2 | 3s | ... | Tracking shot, Soft shadows |

    {markdown_template}
  expected_output: "Bản Visual Prompts chuẩn Markdown gồm: 1 Master Character Reference Sheet Prompt, 1 Master Environment Prompt và Bảng Dynamic Prompts cho Veo3."

image_task:
  description: |
    Dựa trên bảng Visual Prompts: "{previous_result}".
    Nhiệm vụ: Tạo các ảnh Reference mỏ neo (Anchor Images) để làm tài liệu đầu vào cho Tool AI Video (chế độ Image-to-Video / Reference Frame).

    **QUY TẮC ĐẶT TÊN & TỐI ƯU**:
    Chỉ cần sinh **1 đến 2 ảnh Master chuẩn**, đặt tên:
    - `01_master_character_ref.png`: Ảnh nhân vật tham chiếu mỏ neo.
    - `02_master_environment_ref.png`: Ảnh bối cảnh không gian chính.

    **TIẾN TRÌNH THỰC HIỆN**:
    1. Tạo ảnh Master Character Reference bằng `generate_gpt_image`.
    2. Tạo ảnh Master Environment Reference bằng `generate_gpt_image`.
    3. Lưu và trả về danh sách đường dẫn ảnh.

    **Định dạng đầu ra BẮT BUỘC (Markdown)**:
    ### DANH SÁCH ẢNH MASTER REFERENCE ĐÃ TẠO
    | STT | Tên File | Loại | Đường dẫn tuyệt đối |
    |---|---|---|---|
    | 01 | 01_master_character_ref.png | Master Character Reference | /path/to/01_master_character_ref.png |
    | 02 | 02_master_environment_ref.png | Master Environment Reference | /path/to/02_master_environment_ref.png |

    **HƯỚNG DẪN SỬ DỤNG VỚI VEO3 / AI VIDEO**:
    - Sử dụng `01_master_character_ref.png` làm ảnh tham chiếu (Image Prompt / First Frame) cho các cảnh có nhân vật.
    - Copy các đoạn `Combined Visual (EN)` từ kịch bản dán vào Veo 3 để sinh video chuyển động trực tiếp.

    {markdown_template}
  expected_output: "Danh sách đường dẫn ảnh Master Reference và hướng dẫn nạp vào công cụ sinh video Veo3."

voice_task:
  description: |
    Dựa trên kịch bản: "{script}".
    Hãy tổng hợp và biên soạn toàn bộ phần Lời thoại / Thuyết minh thành **1 BẢN VOICE THU ÂM HOÀN CHỈNH (FULL AUDIO TRACK)** liền mạch.

    **YÊU CẦU KẾT QUẢ ĐẦU RA**:
    1. **VĂN BẢN ĐỌC LIỀN MẠCH THEO TIMELINE**:
       Trình bày kịch bản đọc liên tục có đánh dấu mốc thời gian để người thu âm hoặc AI TTS (ElevenLabs/OpenAI) đọc 1 lần từ đầu đến cuối:
       - `[00:00 - 00:03] [NARRATOR]: Câu mở đầu gây sốc...`
       - `[00:03 - 00:07] [DIALOGUE - Tên]: "Câu thoại của nhân vật..."`
       - `[00:07 - 00:12] [NARRATOR]: Lời dẫn tiếp nối...`

    2. **CẤU HÌNH GIỌNG ĐỌC ĐỀ XUẤT**:
       - Gợi ý Voice ID, Stability, Similarity Boost phù hợp cho phong cách kịch tính / truyền cảm hứng.
       - Tốc độ đọc khuyến nghị: 1.05x - 1.1x để vừa khớp nhịp video ngắn.

    {markdown_template}
  expected_output: "Văn bản Voiceover liền mạch kèm timestamp mốc thời gian cho toàn bộ video + cấu hình giọng đọc ElevenLabs chuẩn."

editor_task:
  description: |
    Dựa trên kịch bản: "{script}" và các tài nguyên đã tạo.
    Bạn là Chuyên gia Dựng phim AI. Hướng dẫn quy trình dựng video nhanh và chuyên nghiệp trên CapCut với 1 Track Audio và các Clip Veo 3.

    **[BƯỚC 1: IMPORT TÀI NGUYÊN]**
    - Import 1 file Voiceover tổng (Full Track) đã thu âm / tạo từ ElevenLabs vào Timeline Audio chính.
    - Import các đoạn video clip sinh từ Veo 3 (mỗi clip 3-6s).

    **[BƯỚC 2: KHỚP TIMELINE NHANH GỌN (AUDIO-FIRST SYNC)]**
    - Đặt file Voiceover làm xương sống (Backbone) của toàn bộ video.
    - Kéo các clip video Veo 3 thả vào Video Track tương ứng với từng mốc câu thoại trên timeline.
    - Cắt tỉa (Trim) nhẹ nhàng các đoạn thừa của video để khớp chính xác nhịp chuyển giọng nói.

    **[BƯỚC 3: HIỆU ỨNG CHUYỂN CẢNH, PHỤ ĐỀ & ON-SCREEN FLASH TEXT]**
    - **Chuyển cảnh**: Giữa các clip Veo 3, thêm hiệu ứng chuyển cảnh nhẹ (Cross Dissolve hoặc Flash nhẹ 0.2s) nếu cần.
    - **Auto Captions**: Sử dụng tính năng "Auto Captions" của CapCut để sinh phụ đề tự động tiếng Việt theo giọng đọc. Tùy chỉnh màu chữ nổi bật (Vàng viền đen hoặc Trắng viền đen).
    - **On-Screen Flash Text (Keyphrase)**: Với các từ khóa đập mắt trong cột 5 của kịch bản, tạo Text Overlay kích thước lớn (Bold Sans-serif), màu vàng hổ phách, căn giữa màn hình hoặc góc dưới an toàn (tránh che thanh công cụ TikTok), xuất hiện 0.5s - 1s đồng bộ với điểm nổ âm thanh.
    - **Highlight [CÂU THOẠI VÀNG]**: Đặt subtitle cỡ chữ cực đại, viền phát sáng nhẹ, căn giữa màn hình cho câu thoại đắt giá nhất để tạo điểm neo cảm xúc.

    **[BƯỚC 4: ÂM NHẠC & XUẤT BẢN]**
    - Thêm 1 bài BGM phù hợp với Tone/Mood đã định trong Brief. Bật chế độ **Auto Ducking** (âm lượng BGM giảm xuống 15-20% khi có giọng nói).
    - Xuất video chuẩn 1080x1920 (9:16), 60fps, Bitrate High.

    {markdown_template}
  expected_output: "Hướng dẫn dựng video tinh gọn trên CapCut theo quy trình Audio-First và clip Veo3."