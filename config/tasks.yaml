brief_task:
  description: |
    Dựa trên ý tưởng ban đầu: "{idea}", và bối cảnh kênh: {channel_name} — {channel_description}.
    Mục tiêu kênh: {channel_goal}.

    Hãy xây dựng một bản CREATIVE BRIEF hoàn chỉnh, súc tích và chuyên nghiệp gồm đầy đủ các mục:

    1. **MỤC ĐÍCH NỘI DUNG**
       - Platform mục tiêu: TikTok / Reels / Shorts
       - Mục tiêu video: Giải trí / Cảm xúc / Lan truyền / Giáo dục
       - Thông điệp cốt lõi (Key Message) cần truyền tải

    2. **ĐỐI TƯỢNG XEM MỤC TIÊU**
       - Độ tuổi, giới tính, sở thích
       - Hành vi xem video (xem nhanh, xem đến cuối, chia sẻ...)

    3. **HỒ SƠ NHÂN VẬT CHÍNH (CHARACTER PROFILE)**
       - Tên nhân vật, giới tính, độ tuổi
       - Ngoại hình chi tiết: chiều cao, vóc dáng, màu tóc, kiểu tóc
       - Trang phục đặc trưng cho video này
       - Biểu cảm / tính cách chủ đạo

    4. **BỐI CẢNH & KHÔNG GIAN CHÍNH**
       - Địa điểm chính (1-2 địa điểm tối đa để giữ nhất quán)
       - Thời gian trong ngày, ánh sáng tổng thể
       - Không khí chủ đạo của không gian

    5. **TONE & MOOD**
       - Cảm xúc chủ đạo người xem cảm nhận được
       - Nhịp điệu: chậm rãi / năng động / kịch tính
       - Bảng màu chủ đạo

    6. **PHONG CÁCH NGHỆ THUẬT (ART STYLE — dùng cho sinh ảnh AI)**
       - Phong cách: anime / semi-realistic / cinematic live-action / illustration
       - Kỹ thuật camera: góc quay, lens style (35mm, wide, close-up)
       - Các từ khóa style tiếng Anh để dùng nhất quán trong mọi visual prompt
       - TUYỆT ĐỐI TRÁNH: "photorealistic", "8k", "hyper-detailed", "unreal engine"

    {markdown_template}
  expected_output: "Bản Creative Brief hoàn chỉnh định dạng Markdown với đầy đủ 6 mục: Mục đích, Đối tượng, Nhân vật, Bối cảnh, Tone/Mood, Art Style."

script_task:
  description: |
    Dựa trên CREATIVE BRIEF đã định hướng: "{previous_result}"
    Và ý tưởng gốc: "{idea}"

    Hãy viết kịch bản video ngắn hoàn chỉnh. Lưu ý: Tool AI sinh video của bạn chỉ hỗ trợ tối đa 8 giây/lần sinh ở chế độ START-END (1 Ảnh đầu + 1 Ảnh cuối + 1 Prompt). Do đó, video dài {target_duration}s sẽ được chia thành nhiều CHUNK (mỗi chunk 8 giây).

    **[CẤU TRÚC THỜI LƯỢNG & CHIA CHUNK - BẮT BUỘC]**
    - Tổng thời lượng: {target_duration} giây.
    - Số lượng CHUNK cần có: `ceil({target_duration} / 8.0)` (làm tròn lên). Ví dụ: 60s -> 8 Chunks (7 chunk 8s + 1 chunk 4s).
    - Mỗi CHUNK sẽ được AI sinh ra từ 1 cặp ảnh Start-End. Do đó, tổng số ảnh cần sinh = Số chunk * 2.
    - Bên trong mỗi CHUNK (8s), chia thành các scene nhỏ (2-4s) để tạo nhịp nhanh.

    **[MẬT ĐỘ TỪ VOICEOVER - BẮT BUỘC NGHIÊM NGẶT]**
    - Tốc độ đọc tiếng Việt nhanh kịch tính: **4 từ/giây** (tăng từ 3.5 lên 4 để khớp nhịp TikTok).
    - Tổng video {target_duration}s cần tổng voiceover xấp xỉ ({target_duration} * 4) từ.
    - Phân bổ cứng theo thời lượng cảnh: cảnh 2s ≥ 8 từ; cảnh 3s ≥ 12 từ; cảnh 4s ≥ 16 từ. **TUYỆT ĐỐI KHÔNG ĐỂ TRỐNG CỘT VOICEOVER Ở BẤT KỲ CẢNH NÀO**.

    **[PHÂN ĐỊNH LỜI DẪN CHUYỆN VÀ THOẠI NHÂN VẬT]**
    - Phải có [NARRATOR] dẫn dắt mạch chuyện xuyên suốt.
    - Lời thoại nhân vật [DIALOGUE - Tên] phải giàu tâm lý, băn khoăn, quyết định hoặc bột phát, đặt trong dấu ngoặc kép.
    - KHÔNG cho nhân vật tự đọc lời dẫn chuyện.

    **[PHẦN 1 - TÊN DỰ ÁN & HOOK]**
    - Tên video, định dạng, thời lượng.
    - CHIẾN LƯỢC HOOK 3 GIÂY ĐẦU: Câu thoại gây sốc + hành động mạnh. (Áp dụng cho giây 0-3 của CHUNK 01).

    **[PHẦN 2 - BẢNG PHÂN CẢNH CHI TIẾT (THEO SCENE NHỎ 2-4s)]**
    Trình bày bảng Markdown với 5 cột:
    | Scene | Thời lượng | Visual Description (EN) | Voiceover (VI) | SFX/BGM |
    (Áp dụng đúng các quy tắc Visual Description đã nêu: transition keywords, hành động động, chi tiết ánh sáng, kết thúc bằng "leads to Scene X").

    **[PHẦN 3 - AI VIDEO GENERATION SCRIPT (Gộp theo CHUNK 8s - QUAN TRỌNG)]**
    Căn cứ vào giới hạn 8s của Tool, bạn **BẮT BUỘC** gộp các Scene nhỏ ở Phần 2 thành các CHUNK 8s.
    Định dạng đầu ra cho MỖI CHUNK như sau:

    - **CHUNK X (từ giây A đến giây B)**:
      * **Mô tả khung hình START (Frame 0s)**: [Trích xuất trạng thái của nhân vật, bối cảnh, ánh sáng tại giây đầu tiên của CHUNK này. Mô tả bằng tiếng Anh, dài 3-4 câu, tập trung vào tư thế đứng, biểu cảm mặc định và bố cục tổng thể].
      * **Mô tả khung hình END (Frame 8s)**: [Trích xuất trạng thái của nhân vật, bối cảnh, ánh sáng tại giây cuối cùng của CHUNK này. Mô tả bằng tiếng Anh, dài 3-4 câu, phải có sự thay đổi RÕ RỆT về hành động/biểu cảm so với START để AI có động lực suy diễn chuyển động].
      * **Prompt chính cho Video (8s)**: [Đoạn văn tiếng Anh LIỀN MẠCH, DÀI 8-12 CÂU, mô tả toàn bộ hành trình chuyển động từ START đến END. Phải bao gồm: loại camera (dolly in/out, tracking), sự thay đổi ánh sáng (ví dụ: light shifts from warm to cold), biểu cảm vi biểu (micro-expression), và các chi tiết môi trường (bụi, khói, gió). Kết thúc bằng từ khóa "transitions seamlessly to next CHUNK"].
      * **Voiceover / Dialogue (VI)**: [Gộp toàn bộ Voiceover và Dialogue của các scene con trong CHUNK này. Yêu cầu tổng số từ đạt 28-32 từ (tương đương 4 từ/s * 8s). Phải ghi rõ thẻ [NARRATOR] và [DIALOGUE - Tên]. Nếu thiếu, tự động thêm lời dẫn để lấp đầy].
      * **SFX/BGM**: [Nhạc nền và hiệu ứng âm thanh đặc trưng cho chunk này].

    **[PHẦN 4 - CTA (KẾT THÚC)]**
    - Lời kêu gọi hành động mạnh mẽ. Nội dung này sẽ nằm trong CHUNK cuối cùng (giây cuối của video).
    {markdown_template}
  expected_output: "Kịch bản hoàn chỉnh dạng Markdown. Bao gồm: Hook, bảng phân cảnh chi tiết, và đặc biệt là phần CHUNK 8s đã được tách rời với START/END Frame rõ ràng để chuẩn bị cho việc sinh ảnh."

visual_task:
  description: |
    Dựa trên Phần 3 (AI Video Generation Script) của kịch bản: "{previous_result}".
    Bạn là Visual Prompt Engineer. Nhiệm vụ cụ thể:

    1. **HỒ SƠ NHÂN VẬT (CHARACTER PROFILE)**: Tổng hợp và định nghĩa lại ngoại hình nhân vật để đảm bảo sự nhất quán tuyệt đối (tóc, quần áo, màu da) trong tất cả prompt.

    2. **PHONG CÁCH NGHỆ THUẬT (ART STYLE)**: Phân tích "{channel_description}" để chọn phong cách. 
       - QUY TẮC VÀNG: Thay vì dùng "photorealistic", hãy dùng "cinematic still", "shot on Arri Alexa", "35mm film grain", "natural lighting", "documentary portrait" để ảnh trông tự nhiên, không bị nhựa.

    3. **SINH CẶP PROMPT START-END CHO TỪNG CHUNK**:
       Với MỖI CHUNK đã định nghĩa ở trên, bạn phải viết **2 Prompt sinh ảnh riêng biệt** (dành cho DALL-E/Midjourney) theo cấu trúc:
       `[Art Style Keywords] + [Character Profile] + [Mô tả START Frame hoặc END Frame] + [Camera Angle] + [Lighting] + [Negative Prompt: text, signature, blurry, distorted, 8k, hyperdetailed]`

    **Định dạng đầu ra BẮT BUỘC (Markdown)**:
    ### CHARACTER CONSISTENCY PROFILE
    (Tóm tắt nhân vật để tham chiếu)
    ### ART STYLE FIXED
    (Các từ khóa style dùng chung)
    ### VISUAL PROMPTS FOR AI IMAGE GENERATION
    | CHUNK | START Prompt (EN) | END Prompt (EN) |
    |---|---|---|
    | CHUNK_01 | [Prompt dài 4-6 câu] | [Prompt dài 4-6 câu] |
    | CHUNK_02 | ... | ... |
    | ... | ... | ... |

    {markdown_template}
  expected_output: "Bảng Markdown chứa cặp Prompt Start-End cho toàn bộ các CHUNK, đảm bảo tính đồng bộ về nhân vật và ánh sáng."

image_task:
  description: |
    Dựa trên bảng Visual Prompts từ bước trước: "{previous_result}".
    Tool sinh ảnh của bạn sẽ tạo ra ảnh để đưa vào App AI Video (chế độ Start-End).

    **YÊU CẦU BẮT BUỘC VỀ TÊN FILE (QUAN TRỌNG)**:
    Vì Tool AI Video của bạn sắp xếp ảnh theo thứ tự Alphabet và yêu cầu số thứ tự 001, 002... (nếu đặt 1,2,3 sẽ bị lỗi), bạn phải đặt tên file theo quy tắc sau:
    - Định dạng: `chunk_{STT}_start.png` và `chunk_{STT}_end.png` (STT phải là 2 chữ số, ví dụ: 01, 02... 10).
    - Với video 60s có 8 Chunks, bạn sẽ sinh ra **16 ảnh**.
    - **Lưu ý dung lượng**: Tổng ảnh không vượt quá 350MB (giới hạn tool), nếu ảnh quá nặng hãy giảm kích thước xuống 1024x1024 hoặc 1080x1920.

    **TIẾN TRÌNH THỰC HIỆN**:
    1. Lặp qua từng hàng trong bảng Visual Prompts.
    2. Gọi công cụ `generate_gpt_image` với START Prompt để tạo ảnh đầu.
    3. Gọi công cụ `generate_gpt_image` với END Prompt để tạo ảnh cuối.
    4. Lưu ảnh với đúng tên quy định.

    **Định dạng đầu ra BẮT BUỘC (Markdown)**:
    ### DANH SÁCH ẢNH ĐÃ TẠO (ĐỂ UPLOAD LÊN TOOL)
    | STT | Tên File | Loại | Đường dẫn tuyệt đối |
    |---|---|---|---|
    | 01 | chunk_01_start.png | START | /path/to/... |
    | 02 | chunk_01_end.png | END | /path/to/... |
    | ... | ... | ... | ... |

    **HƯỚNG DẪN UPLOAD LÊN TOOL**:
    - Vào chế độ **"Tạo video từ ảnh đầu-cuối (Start-End)"**.
    - Upload toàn bộ ảnh START vào danh sách ảnh bắt đầu.
    - Upload toàn bộ ảnh END vào danh sách ảnh kết thúc.
    - Dán prompt tương ứng cho từng cặp (lấy từ Phần 3 của kịch bản).
    - Tool sẽ tự động sinh ra số lượng video bằng số CHUNK.

    {markdown_template}
  expected_output: "Danh sách đường dẫn ảnh cục bộ với tên file đã được chuẩn hóa (start/end + STT 2 chữ số) để sẵn sàng đưa vào tool."

voice_task:
  description: |
    Dựa trên kịch bản gốc ở bước 1: "{script}".
    Hãy lọc, phân loại và kết hợp toàn bộ phần Lời thoại/Thuyết minh (Voiceover) của các phân cảnh để chuẩn bị cho việc lồng tiếng.
    
    Yêu cầu kết quả đầu ra:
    1. **PHÂN CHIA VĂN BẢN ĐỌC CHI TIẾT**: Tách biệt rõ ràng phần văn bản đọc theo vai:
       - [NARRATOR]: Lời dẫn chuyện đóng vai trò dẫn dắt và kết nối câu chuyện.
       - [DIALOGUE - Tên nhân vật]: Lời thoại riêng của nhân vật (để trong ngoặc kép).
    2. **ĐỀ XUẤT GIỌNG ĐỌC RIÊNG BIỆT**: Gợi ý chi tiết cấu hình ElevenLabs khác nhau cho từng vai (giọng đọc riêng cho Người dẫn chuyện và giọng đọc riêng cho từng nhân vật phát biểu) để đảm bảo không bị trùng giọng đọc.
    {markdown_template}
  expected_output: "Văn bản lồng tiếng hoàn chỉnh phân chia rõ ràng theo vai (Narrator và Nhân vật) + đề xuất cấu hình giọng đọc ElevenLabs riêng biệt cho từng vai."

editor_task:
  description: |
    Dựa trên kịch bản: "{script}" và danh sách ảnh đã tạo ở bước `image_task`.
    Bạn là Chuyên gia Dựng phim AI. Hướng dẫn chi tiết quy trình ghép nối các Clip AI trên CapCut để ra sản phẩm hoàn chỉnh.

    **[BƯỚC 1: CHUẨN BỊ TÀI NGUYÊN]**
    - Xuất các video con từ Tool AI (mỗi video dài 8s, tương ứng với 1 CHUNK). Đặt tên lần lượt là `chunk_01.mp4`, `chunk_02.mp4`...
    - Tải file Voiceover tổng (đã được tách giọng Narrator và Dialogue riêng biệt nếu có).

    **[BƯỚC 2: ĐỒNG BỘ ÂM THANH & HÌNH ẢNH (SYNC)]**
    - Mở CapCut, import tất cả file `chunk_XX.mp4` và file voiceover.
    - **Kỹ thuật ghép nối mượt mà (Quan trọng)**: Vì AI sinh mỗi clip 8s không có transition tự nhiên, bạn cần:
      1. Kéo thả các clip `chunk_01`, `chunk_02`... nối tiếp nhau trên timeline.
      2. Tại vị trí tiếp giáp giữa 2 clip, thêm hiệu ứng **"Cross Dissolve"** (hoặc "Fade") với thời lượng **0.3s - 0.5s**. Điều này giúp che đi sự khác biệt nhỏ về ánh sáng/hình ảnh giữa các lần sinh AI khác nhau, tạo cảm giác liền mạch.
      3. Khớp file Voiceover đã được cắt sẵn theo từng CHUNK vào đúng vị trí thời gian tương ứng.

    **[BƯỚC 3: HIỆU ỨNG & CHUYỂN CẢNH (EFFECTS & TRANSITIONS)]**
    - **Motion Blur**: Bật chế độ "Motion Blur" nhẹ (nếu có) để các chuyển động do AI tạo ra trông mượt hơn, tránh giật hình.
    - **Auto Captions (Phụ đề)**: Dùng tính năng "Auto Captions" của CapCut. Chọn style phụ đề nổi bật (màu trắng viền đen) và căn giữa. Tăng tốc độ xuất hiện của phụ đề để khớp với giọng đọc nhanh.
    - **Text Animation**: Thêm hiệuệu ứng "Typewriter" hoặc "Pop up" cho các từ khóa quan trọng để tăng tương tác.

    **[BƯỚC 4: MÀU SẮC (COLOR GRADING) & ÂM THANH]**
    - **LUT/Filter**: Áp dụng 1 filter chung cho toàn bộ video để đồng bộ màu sắc giữa các clip AI (vì màu sắc giữa các lần sinh có thể lệch). Gợi ý dùng filter nhẹ như "Clean" hoặc "Natural" để hài hòa da và bối cảnh.
    - **Âm thanh (Audio Ducking)**: BGM (nhạc nền) để âm lượng khoảng 15-20%. Voiceover để 100%. Bật chế độ "Ducking" để nhạc tự động hạ xuống khi có giọng nói.

    **[BƯỚC 5: XUẤT FILE]**
    - Cấu hình xuất: 1080p, 60fps (để video AI không bị giật), H.264.
    - Thời lượng tổng phải đúng bằng {target_duration}s ± 0.5s.

    {markdown_template}
  expected_output: "Cẩm nang dựng video chi tiết trên CapCut theo đúng quy trình AI (Chia Chunk, Cross Dissolve, Auto Caption, Audio Ducking)."